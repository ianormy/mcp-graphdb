[project]
name = "mcp-graphdb-server"
version = "0.1.8"
description = "A simple GraphDB MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0",
    "rdflib>=7.1.4",
    "pydantic>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
 "pytest>=7.0.0",
 "pytest-asyncio>=0.20.3",
]

[project.scripts]
mcp-graphdb-server = "mcp_graphdb_server:main"
